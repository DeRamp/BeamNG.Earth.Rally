# Earth Rally's online board on Cloudflare's free plan (Workers + D1). docs/online-board.md has the steps.
name = "earth-rally-board"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "earth-rally"
database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"

# The admin token is a secret, never in this file: npx wrangler secret put ADMIN_TOKEN
